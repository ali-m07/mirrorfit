<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابدار شخصی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <h1>💰 حسابدار شخصی</h1>
        <p class="subtitle">دریافتی خالص − خرج‌ها = چقدر مونده؟</p>
      </div>
      <div class="header-date" id="currentDate"></div>
    </header>

    <section class="summary-cards" id="summaryCards"></section>
    <section class="alert-box" id="alertBox"></section>

    <section class="panel action-panel">
      <div class="panel-header"><h2>🔧 چیکار کنیم؟</h2></div>
      <div id="actionBox" class="action-list"></div>
    </section>

    <div class="grid-layout">
      <section class="panel">
        <div class="panel-header">
          <h2>💵 دریافتی خالص</h2>
          <button class="btn-icon" onclick="addIncome()">+</button>
        </div>
        <div id="incomeList" class="item-list"></div>
      </section>
      <section class="panel">
        <div class="panel-header">
          <h2>📋 اقساط ثابت</h2>
          <button class="btn-icon" onclick="addFixedExpense()">+</button>
        </div>
        <div id="fixedExpenseList" class="item-list"></div>
      </section>
      <section class="panel">
        <div class="panel-header">
          <h2>⏳ اقساط موقت</h2>
          <button class="btn-icon" onclick="addTempExpense()">+</button>
        </div>
        <div id="tempExpenseList" class="item-list"></div>
      </section>
      <section class="panel">
        <div class="panel-header">
          <h2>⚡ هزینه‌های اضافی</h2>
          <button class="btn-icon" onclick="addOneTimeExpense()">+</button>
        </div>
        <div id="oneTimeList" class="item-list"></div>
      </section>
    </div>

    <section class="panel budget-panel">
      <div class="panel-header"><h2>🧮 حساب شهریور</h2></div>
      <div class="budget-breakdown" id="budgetBreakdown"></div>
    </section>

    <section class="panel forecast-panel">
      <div class="panel-header"><h2>📊 ماه‌های بعد</h2></div>
      <div class="forecast-chart" id="forecastChart"></div>
      <div class="forecast-table-wrap">
        <table class="forecast-table">
          <thead>
            <tr><th>ماه</th><th>دریافتی</th><th>خرج</th><th>مانده</th><th>وضعیت</th></tr>
          </thead>
          <tbody id="forecastBody"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
